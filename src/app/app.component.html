<div class="principal">

    <h1>Cadastro de Veículos</h1>

    <label for="modelo">Modelo do Veículo</label>
    <input
        id="modelo"
        type="text"
        [(ngModel)]="modelo"
        placeholder="Digite o modelo do veículo">

    <label for="valor">Valor do Serviço (R$)</label>
    <input
        id="valor"
        type="number"
        [(ngModel)]="valor"
        placeholder="Digite o valor do serviço">

    <button (click)="cadastrar()">
        {{ indiceEdicao !== null ? 'Atualizar' : 'Cadastrar' }}
    </button>

    <hr>

    <h2>Veículos Cadastrados</h2>

    <table>

        <thead>
            <tr>
                <th>Modelo</th>
                <th>Valor do Serviço</th>
                <th>Ação</th>
            </tr>
        </thead>

        <tbody>

            <tr *ngFor="let item of lista; let i = index">

                <td>{{ item.modelo }}</td>

                <td>{{ item.valor | currency:'BRL' }}</td>

                <td>

                    <button class="editar" (click)="editar(i)">
                        Editar
                    </button>

                    <button class="remover" (click)="remover(i)">
                        Remover
                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>
