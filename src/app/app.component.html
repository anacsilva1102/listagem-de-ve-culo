<div class="principal">

  <h1>Cadastro de Veículos</h1>

  <label>Modelo do Veículo</label>

  <input
      type="text"
      [(ngModel)]="modelo"
      placeholder="Digite o modelo do veículo">

  <label>Valor do Serviço (R$)</label>

  <input
      type="number"
      [(ngModel)]="valor"
      placeholder="Digite o valor do serviço">

  <button (click)="cadastrar()">
      Cadastrar
  </button>

  <hr>

  <h2>Veículos Cadastrados</h2>

  <table *ngIf="lista.length > 0">

      <thead>
          <tr>
              <th>Modelo</th>
              <th>Valor do Serviço</th>
              <th>Ação</th>
          </tr>
      </thead>

      <tbody>
          <tr *ngFor="let item of lista; let i = index">

              <td>{{ item.modelo }}</td>

              <td>{{ item.valor | currency:'BRL' }}</td>

              <td>
                  <button class="remover" (click)="remover(i)">
                      Remover
                  </button>
              </td>

          </tr>
      </tbody>

  </table>

  <p *ngIf="lista.length == 0">
      Nenhum veículo cadastrado.
  </p>

</div>
